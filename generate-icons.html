<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Generate Icons</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f0f0f0;
    }
    .icon-container {
      display: inline-block;
      margin: 20px;
      text-align: center;
    }
    canvas {
      border: 1px solid #ccc;
      background: white;
      display: block;
      margin: 10px auto;
    }
    button {
      padding: 10px 20px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background: #45a049;
    }
    h2 {
      color: #333;
    }
  </style>
</head>
<body>
  <h1>Chrome Extension Icon Generator</h1>
  <p>Click the download buttons to save the icons as PNG files.</p>

  <div class="icon-container">
    <h2>16x16</h2>
    <canvas id="canvas16" width="16" height="16"></canvas>
    <button onclick="downloadIcon('canvas16', 'icon16.png')">Download 16x16</button>
  </div>

  <div class="icon-container">
    <h2>48x48</h2>
    <canvas id="canvas48" width="48" height="48"></canvas>
    <button onclick="downloadIcon('canvas48', 'icon48.png')">Download 48x48</button>
  </div>

  <div class="icon-container">
    <h2>128x128</h2>
    <canvas id="canvas128" width="128" height="128"></canvas>
    <button onclick="downloadIcon('canvas128', 'icon128.png')">Download 128x128</button>
  </div>

  <script>
    function drawIcon(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      
      // Background
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#4CAF50');
      gradient.addColorStop(1, '#45a049');
      
      ctx.fillStyle = gradient;
      const radius = size * 0.15;
      roundRect(ctx, 0, 0, size, size, radius);
      ctx.fill();
      
      // Play button
      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.moveTo(size * 0.33, size * 0.25);
      ctx.lineTo(size * 0.33, size * 0.75);
      ctx.lineTo(size * 0.75, size * 0.5);
      ctx.closePath();
      ctx.fill();
      
      // "x" text
      ctx.font = `bold ${size * 0.28}px Arial`;
      ctx.fillStyle = 'white';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'bottom';
      ctx.fillText('x', size * 0.95, size * 0.95);
    }
    
    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }
    
    function downloadIcon(canvasId, filename) {
      const canvas = document.getElementById(canvasId);
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
    
    // Draw all icons on page load
    drawIcon('canvas16', 16);
    drawIcon('canvas48', 48);
    drawIcon('canvas128', 128);
  </script>
</body>
</html>
