<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Speed Buttons</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="panel-header">
      <h2>Speed Control</h2>
      <button id="collapseBtn" class="icon-btn" aria-expanded="true" title="Collapse panel">−</button>
    </div>

    <div class="panel-content" id="panelContent">
      <div class="theme-row" aria-label="Screen mode selector">
        <span class="theme-label">Screen mode</span>
        <div class="theme-options" role="group" aria-label="Screen mode">
          <button type="button" class="theme-btn" data-theme="light">Day</button>
          <button type="button" class="theme-btn" data-theme="dim">Dim</button>
          <button type="button" class="theme-btn" data-theme="night">Night</button>
          <button type="button" class="theme-btn" data-theme="movie">Movie</button>
          <button type="button" class="theme-btn" data-theme="reading">Reading</button>
          <button type="button" class="theme-btn" data-theme="focus">Focus</button>
        </div>
      </div>

      <div class="button-grid">
        <button class="speed-btn" data-speed="1">1</button>
        <button class="speed-btn" data-speed="1.1">1.1</button>
        <button class="speed-btn" data-speed="1.15">1.15</button>
        <button class="speed-btn" data-speed="1.2">1.2</button>
        <button class="speed-btn" data-speed="1.25">1.25</button>
        <button class="speed-btn" data-speed="1.3">1.3</button>
        <button class="speed-btn" data-speed="1.35">1.35</button>
        <button class="speed-btn" data-speed="1.4">1.4</button>
        <button class="speed-btn" data-speed="1.45">1.45</button>
        <button class="speed-btn" data-speed="1.5">1.5</button>
        <button class="speed-btn" data-speed="1.55">1.55</button>
        <button class="speed-btn" data-speed="1.6">1.6</button>
        <button class="speed-btn" data-speed="1.65">1.65</button>
        <button class="speed-btn" data-speed="1.75">1.75</button>
            <button class="speed-btn" data-speed="1.8">1.8</button>
        <button class="speed-btn" data-speed="1.85">1.85</button>
        <button class="speed-btn" data-speed="1.9">1.9</button>
        <button class="speed-btn" data-speed="1.95">1.95</button>
        <button class="speed-btn" data-speed="1.95">1.95</button>
        <button class="speed-btn" data-speed="2">2</button>
        <button class="speed-btn" data-speed="2.25">2.25</button>
        <button class="speed-btn" data-speed="2.5">2.5</button>
        <button class="speed-btn" data-speed="2.75">2.75</button>
        <button class="speed-btn" data-speed="3">3</button>
        <button class="speed-btn" data-speed="3.25">3.25</button>
        <button class="speed-btn" data-speed="3.5">3.5</button>

        <button class="speed-btn" data-speed="4">4</button>
        <button class="speed-btn" data-speed="5">5</button>
        <button class="speed-btn" data-speed="6">6</button>
        <button class="speed-btn" data-speed="7">7</button>
        <button class="speed-btn" data-speed="8">8</button>
        <button class="speed-btn" data-speed="9">9</button>
        <button class="speed-btn" data-speed="10">10</button>
        <button class="speed-btn" data-speed="15">15</button>
        <button class="speed-btn" data-speed="16">16</button>
      </div>
      
      <div class="clock" id="clockDisplay">
        00:00:00
      </div>
      <div class="action-row">
        <button id="skipAdBtn" class="control-btn" type="button">Skip Ad</button>
        <button id="rewindBtn" class="control-btn secondary" type="button">Go Back 1 min</button>
        <button id="forwardBtn" class="control-btn secondary" type="button">Go Forward 1 min</button>
        <button id="openIframeVideoBtn" class="control-btn" type="button">Open Video in Tab</button>
        <div class="loop-row">
          <label class="loop-toggle">
            <input type="checkbox" id="loopToggle">
            <span class="loop-slider" aria-hidden="true"></span>
            <span class="loop-text">Loop video</span>
          </label>
          <div class="loop-status" id="loopStatus">Loop: Off</div>
        </div>
      </div>
      <div class="video-status" id="videoStatus">
        No video info yet. Pick a speed to fetch playback progress.
      </div>
      <div class="speed-timer" id="speedTimer">
        Speed timer: --
      </div>
     
      <div class="ad-status" id="adStatus">Ad status: Waiting for action.</div>
      <div class="rewind-status" id="rewindStatus">Rewind status: Waiting for action.</div>
      
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
