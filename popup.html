<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Speed Buttons</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="panel-header">
      <h2>Speed Control</h2>
      <button id="collapseBtn" class="icon-btn" aria-expanded="true" title="Collapse panel">−</button>
    </div>

    <div class="panel-content" id="panelContent">
      <div class="button-grid">
        <button class="speed-btn" data-speed="1">1x</button>
        <button class="speed-btn" data-speed="1.25">1.25x</button>
        <button class="speed-btn" data-speed="1.5">1.5x</button>
        <button class="speed-btn" data-speed="1.75">1.75x</button>
        <button class="speed-btn" data-speed="2">2x</button>
        <button class="speed-btn" data-speed="2.25">2.25x</button>
        <button class="speed-btn" data-speed="2.5">2.5x</button>
        <button class="speed-btn" data-speed="2.75">2.75x</button>
        <button class="speed-btn" data-speed="3">3x</button>
        <button class="speed-btn" data-speed="3.25">3.25x</button>
        <button class="speed-btn" data-speed="3.5">3.5x</button>

        <button class="speed-btn" data-speed="4">4x</button>
        <button class="speed-btn" data-speed="5">5x</button>
        <button class="speed-btn" data-speed="6">6x</button>
        <button class="speed-btn" data-speed="7">7x</button>
        <button class="speed-btn" data-speed="8">8x</button>
        <button class="speed-btn" data-speed="9">9x</button>
        <button class="speed-btn" data-speed="10">10x</button>
      </div>
      
      <div class="clock" id="clockDisplay">
        00:00:00
      </div>
      <div class="action-row">
        <button id="skipAdBtn" class="control-btn" type="button">Skip Ad</button>
        <button id="rewindBtn" class="control-btn secondary" type="button">Go Back 1 min</button>
        <button id="forwardBtn" class="control-btn secondary" type="button">Go Forward 1 min</button>
      </div>
      <div class="video-status" id="videoStatus">
        No video info yet. Pick a speed to fetch playback progress.
      </div>
      <div class="speed-timer" id="speedTimer">
        Speed timer: --
      </div>
     
      <div class="ad-status" id="adStatus">Ad status: Waiting for action.</div>
      <div class="rewind-status" id="rewindStatus">Rewind status: Waiting for action.</div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
